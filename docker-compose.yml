version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: heatflow_postgres
    environment:
      POSTGRES_USER: heatflow
      POSTGRES_PASSWORD: heatflow123
      POSTGRES_DB: heatflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  api1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: heatflow_api1
    environment:
      DATABASE_URL: postgresql://heatflow:heatflow123@postgres:5432/heatflow_db
      WORKER_ID: api1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net

  api2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: heatflow_api2
    environment:
      DATABASE_URL: postgresql://heatflow:heatflow123@postgres:5432/heatflow_db
      WORKER_ID: api2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net

  nginx:
    image: nginx:stable-alpine
    container_name: heatflow_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_data:
