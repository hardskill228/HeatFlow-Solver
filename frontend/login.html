<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HeatFlow Solver — вхід</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="auth-page">
  <main id="authRoot" class="login-container">
    <form id="loginForm" class="login-box" autocomplete="off">
      <div class="auth-card-head">
        <h1 id="authTitle">Вхід</h1>
        <p id="authSubtitle" class="auth-subtitle">Увійдіть в обліковий запис, щоб запускати розрахунки теплопровідності.</p>
      </div>

      <div class="auth-tabs" aria-label="Режим автентифікації">
        <button type="button" id="loginModeBtn" class="auth-tab is-active">Вхід</button>
        <button type="button" id="registerBtn" class="auth-tab">Реєстрація</button>
      </div>

      <label class="field">
        <span>Ім'я користувача</span>
        <small class="field-help">Це ім'я видно в застосунку та рейтингу.</small>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </label>

      <label class="field">
        <span>Пароль</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>

      <section id="registerDetails" class="register-details is-hidden" aria-hidden="true">
        <div class="register-details-head">
          <h2>Створення акаунта</h2>
          <p>Підтвердьте пароль. Решту даних можна додати зараз або пізніше у профілі.</p>
        </div>

        <label class="field">
          <span>Підтвердження пароля</span>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Повторіть пароль" />
        </label>

        <button type="button" id="profileDetailsToggle" class="profile-details-toggle" aria-expanded="false" aria-controls="profileDetailsFields">
          Додати фото та контактні дані
        </button>

        <div id="profileDetailsFields" class="register-grid profile-details-fields is-collapsed">
          <label class="field">
            <span>Ім'я</span>
            <small class="field-help">Ваше справжнє ім'я або зручне відображуване ім'я.</small>
            <input id="name" name="name" type="text" placeholder="Данило" />
          </label>

          <label class="field">
            <span>Електронна пошта</span>
            <input id="email" name="email" type="email" placeholder="you@example.com" />
          </label>

          <label class="field register-span-2">
            <span>Фото профілю</span>
            <div class="avatar-upload-row">
              <div id="registerAvatarPreview" class="avatar-preview avatar-preview-small">+</div>
              <div class="avatar-upload-actions">
                <input id="registerAvatar" name="registerAvatar" type="file" accept="image/*" hidden />
                <button id="registerAvatarBtn" type="button" class="btn btn-ghost profile-inline-btn">Завантажити фото</button>
                <span id="registerAvatarName" class="file-upload-name">Файл не вибрано</span>
              </div>
            </div>
          </label>

          <label class="field register-span-2">
            <span>Адреса</span>
            <input id="address" name="address" type="text" placeholder="Вулиця, будинок, квартира" />
          </label>

          <label class="field">
            <span>Місто</span>
            <input id="city" name="city" type="text" placeholder="Київ" />
          </label>

          <label class="field">
            <span>Телефон</span>
            <input id="phone" name="phone" type="tel" placeholder="+380..." />
          </label>
        </div>
      </section>

      <div class="actions">
        <button type="submit" id="loginBtn" class="btn btn-primary" style="flex:1;justify-content:center;padding:14px 18px;font-size:18px">Далі</button>
      </div>

      <div class="auth-switch">
        <p id="authSwitchText">Вперше тут? Перейдіть на вкладку реєстрації.</p>
      </div>

      <p id="error" class="error" aria-live="polite"></p>

    </form>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("loginForm");
    const authRoot = document.getElementById("authRoot");
    const err = document.getElementById("error");
    const registerDetails = document.getElementById("registerDetails");
    const loginModeBtn = document.getElementById("loginModeBtn");
    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const authSwitchText = document.getElementById("authSwitchText");
    const profileDetailsToggle = document.getElementById("profileDetailsToggle");
    const profileDetailsFields = document.getElementById("profileDetailsFields");
    const passwordInput = document.getElementById("password");
    const registerAvatarInput = document.getElementById("registerAvatar");
    const registerAvatarBtn = document.getElementById("registerAvatarBtn");
    const registerAvatarName = document.getElementById("registerAvatarName");
    const registerAvatarPreview = document.getElementById("registerAvatarPreview");
    let isRegisterMode = false;
    let registerAvatarUrl = '';

    async function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Не вдалося прочитати зображення.'));
        reader.readAsDataURL(file);
      });
    }

    function drawAvatarPreview(value) {
      if (!value) {
        registerAvatarPreview.classList.remove('has-image');
        registerAvatarPreview.innerHTML = '+';
        registerAvatarName.textContent = 'Файл не вибрано';
        return;
      }
      registerAvatarPreview.classList.add('has-image');
      registerAvatarPreview.innerHTML = `<img src="${value}" alt="Попередній перегляд фото" />`;
    }

    function setMode(nextMode) {
      isRegisterMode = nextMode === 'register';
      form.classList.toggle('mode-register', isRegisterMode);
      authRoot.classList.toggle('register-mode', isRegisterMode);
      registerDetails.classList.toggle('is-hidden', !isRegisterMode);
      registerDetails.setAttribute('aria-hidden', String(!isRegisterMode));
      loginModeBtn.classList.toggle('is-active', !isRegisterMode);
      registerBtn.classList.toggle('is-active', isRegisterMode);
      loginModeBtn.setAttribute('aria-pressed', String(!isRegisterMode));
      registerBtn.setAttribute('aria-pressed', String(isRegisterMode));
      authTitle.textContent = isRegisterMode ? 'Створення акаунта' : 'Вхід';
      authSubtitle.textContent = isRegisterMode
        ? 'Вкажіть ім’я користувача та пароль. Дані профілю можна заповнити окремо.'
        : 'Увійдіть в обліковий запис, щоб запускати розрахунки теплопровідності.';
      loginBtn.textContent = isRegisterMode ? 'Створити акаунт' : 'Далі';
      passwordInput.setAttribute('autocomplete', isRegisterMode ? 'new-password' : 'current-password');
      authSwitchText.textContent = isRegisterMode
        ? 'Вже маєте акаунт? Перейдіть на вкладку входу.'
        : 'Вперше тут? Перейдіть на вкладку реєстрації.';
      if (!isRegisterMode) {
        profileDetailsFields.classList.add('is-collapsed');
        profileDetailsToggle.setAttribute('aria-expanded', 'false');
      }
      err.textContent = '';
      err.style.color = '';
    }

  form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      err.textContent = "";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        err.textContent = "Введіть ім'я користувача та пароль.";
        return;
      }

      if (isRegisterMode) {
        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        const profileMeta = {
          name: document.getElementById('name').value.trim(),
          avatar_url: registerAvatarUrl,
          email: document.getElementById('email').value.trim(),
          address: document.getElementById('address').value.trim(),
          city: document.getElementById('city').value.trim(),
          phone: document.getElementById('phone').value.trim()
        };
        if (!confirmPassword) {
          err.textContent = 'Підтвердьте пароль.';
          return;
        }
        if (password !== confirmPassword) {
          err.textContent = 'Паролі не збігаються.';
          return;
        }
        try {
          const resp = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({username, password, ...profileMeta})
          });
          if (!resp.ok) {
            const json = await resp.json().catch(()=>({detail:'Не вдалося зареєструвати акаунт'}));
            err.textContent = json.detail || 'Не вдалося зареєструвати акаунт';
            return;
          }
          setMode('login');
          err.style.color = '#15803d';
          err.textContent = 'Акаунт створено. Тепер увійдіть.';
          return;
        } catch (e) {
          err.textContent = 'Помилка мережі';
          return;
        }
      }

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username, password})
        });
        if (!resp.ok) {
          const json = await resp.json().catch(()=>({detail:'Не вдалося увійти'}));
          err.textContent = json.detail || 'Не вдалося увійти';
          return;
        }
        const data = await resp.json();
        sessionStorage.setItem('hf_username', data.username);
        sessionStorage.setItem('hf_token', data.token);
        window.location.href = '/app';
      } catch (e) {
        err.textContent = 'Помилка мережі';
      }
    });

    loginModeBtn.addEventListener('click', () => {
      setMode('login');
    });

    registerBtn.addEventListener('click', () => {
      setMode('register');
    });

    profileDetailsToggle.addEventListener('click', () => {
      const isCollapsed = profileDetailsFields.classList.toggle('is-collapsed');
      profileDetailsToggle.setAttribute('aria-expanded', String(!isCollapsed));
    });

    registerAvatarBtn.addEventListener('click', () => {
      registerAvatarInput.click();
    });

    registerAvatarInput.addEventListener('change', async () => {
      const file = registerAvatarInput.files && registerAvatarInput.files[0];
      if (!file) {
        registerAvatarUrl = '';
        drawAvatarPreview('');
        return;
      }
      if (!file.type.startsWith('image/')) {
        err.textContent = 'Виберіть файл зображення для фото профілю.';
        registerAvatarInput.value = '';
        return;
      }
      try {
        registerAvatarUrl = await fileToDataUrl(file);
        registerAvatarName.textContent = file.name;
        drawAvatarPreview(registerAvatarUrl);
      } catch (e) {
        err.textContent = 'Не вдалося завантажити зображення.';
      }
    });

    setMode('login');
    drawAvatarPreview('');
  });
  </script>
</body>
</html>
