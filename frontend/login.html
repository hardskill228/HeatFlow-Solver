<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HeatFlow Solver — Login</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="login-container">
    <form id="loginForm" class="login-box" autocomplete="off">
      <h1 id="authTitle">Sign in</h1>
      <p id="authSubtitle" class="auth-subtitle">Use your existing account to continue.</p>
      <label class="field">
        <span>Username</span>
        <small class="field-help">This is the name other users will see in the app.</small>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </label>

      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>

      <section id="registerDetails" class="register-details is-hidden">
        <div class="register-details-head">
          <h2>Registration Details</h2>
          <p>Optional profile info for new accounts.</p>
        </div>

        <label class="field">
          <span>Confirm password</span>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" />
        </label>

        <div class="register-grid">
          <label class="field">
            <span>Name</span>
            <small class="field-help">Your real name or how you want to identify yourself.</small>
            <input id="name" name="name" type="text" placeholder="Danylo" />
          </label>

          <label class="field">
            <span>Email</span>
            <input id="email" name="email" type="email" placeholder="you@example.com" />
          </label>

          <label class="field register-span-2">
            <span>Profile photo</span>
            <div class="avatar-upload-row">
              <div id="registerAvatarPreview" class="avatar-preview avatar-preview-small">+</div>
              <div class="avatar-upload-actions">
                <input id="registerAvatar" name="registerAvatar" type="file" accept="image/*" hidden />
                <button id="registerAvatarBtn" type="button" class="btn btn-ghost profile-inline-btn">Upload photo</button>
                <span id="registerAvatarName" class="file-upload-name">No file chosen</span>
              </div>
            </div>
          </label>

          <label class="field register-span-2">
            <span>Address</span>
            <input id="address" name="address" type="text" placeholder="Street, house, apartment" />
          </label>

          <label class="field">
            <span>City</span>
            <input id="city" name="city" type="text" placeholder="Kyiv" />
          </label>

          <label class="field">
            <span>Phone</span>
            <input id="phone" name="phone" type="tel" placeholder="+380..." />
          </label>
        </div>
      </section>

      <div class="actions">
        <button type="submit" id="loginBtn" class="btn btn-primary" style="flex:1;justify-content:center;padding:14px 18px;font-size:18px">Далі</button>
      </div>

      <div class="auth-switch">
        <p id="authSwitchText">New here? Create an account with additional details.</p>
        <button type="button" id="registerBtn" class="btn btn-accent-alt auth-switch-btn">Зареєструватись</button>
      </div>

      <p id="error" class="error" aria-live="polite"></p>

      <p class="note">Demo login: any non-empty username & password. This is client-side only.</p>
    </form>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("loginForm");
    const err = document.getElementById("error");
    const registerDetails = document.getElementById("registerDetails");
    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const authSwitchText = document.getElementById("authSwitchText");
    const registerAvatarInput = document.getElementById("registerAvatar");
    const registerAvatarBtn = document.getElementById("registerAvatarBtn");
    const registerAvatarName = document.getElementById("registerAvatarName");
    const registerAvatarPreview = document.getElementById("registerAvatarPreview");
    let isRegisterMode = false;
    let registerAvatarUrl = '';

    async function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read image.'));
        reader.readAsDataURL(file);
      });
    }

    function drawAvatarPreview(value) {
      if (!value) {
        registerAvatarPreview.classList.remove('has-image');
        registerAvatarPreview.innerHTML = '+';
        registerAvatarName.textContent = 'No file chosen';
        return;
      }
      registerAvatarPreview.classList.add('has-image');
      registerAvatarPreview.innerHTML = `<img src="${value}" alt="Avatar preview" />`;
    }

    function setMode(nextMode) {
      isRegisterMode = nextMode === 'register';
      form.classList.toggle('mode-register', isRegisterMode);
      registerDetails.classList.toggle('is-hidden', !isRegisterMode);
      authTitle.textContent = isRegisterMode ? 'Create account' : 'Sign in';
      authSubtitle.textContent = isRegisterMode
        ? 'Fill in the basic fields and add a few extra details for your new profile.'
        : 'Use your existing account to continue.';
      loginBtn.textContent = isRegisterMode ? 'Create Account' : 'Далі';
      registerBtn.textContent = isRegisterMode ? 'Назад до входу' : 'Зареєструватись';
      authSwitchText.textContent = isRegisterMode
        ? 'Already have an account? Switch back to sign in.'
        : 'New here? Create an account with additional details.';
      err.textContent = '';
      err.style.color = '';
    }

  form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      err.textContent = "";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        err.textContent = "Please enter both username and password.";
        return;
      }

      if (isRegisterMode) {
        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        const profileMeta = {
          name: document.getElementById('name').value.trim(),
          avatar_url: registerAvatarUrl,
          email: document.getElementById('email').value.trim(),
          address: document.getElementById('address').value.trim(),
          city: document.getElementById('city').value.trim(),
          phone: document.getElementById('phone').value.trim()
        };
        if (!confirmPassword) {
          err.textContent = 'Please confirm your password.';
          return;
        }
        if (password !== confirmPassword) {
          err.textContent = 'Passwords do not match.';
          return;
        }
        try {
          const resp = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({username, password, ...profileMeta})
          });
          if (!resp.ok) {
            const json = await resp.json().catch(()=>({detail:'Register failed'}));
            err.textContent = json.detail || 'Register failed';
            return;
          }
          err.style.color = 'lightgreen';
          err.textContent = 'Account created. Now sign in.';
          setMode('login');
          return;
        } catch (e) {
          err.textContent = 'Network error';
          return;
        }
      }

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username, password})
        });
        if (!resp.ok) {
          const json = await resp.json().catch(()=>({detail:'Login failed'}));
          err.textContent = json.detail || 'Login failed';
          return;
        }
        const data = await resp.json();
        sessionStorage.setItem('hf_username', data.username);
        sessionStorage.setItem('hf_token', data.token);
        window.location.href = '/app';
      } catch (e) {
        err.textContent = 'Network error';
      }
    });

    registerBtn.addEventListener('click', () => {
      setMode(isRegisterMode ? 'login' : 'register');
    });

    registerAvatarBtn.addEventListener('click', () => {
      registerAvatarInput.click();
    });

    registerAvatarInput.addEventListener('change', async () => {
      const file = registerAvatarInput.files && registerAvatarInput.files[0];
      if (!file) {
        registerAvatarUrl = '';
        drawAvatarPreview('');
        return;
      }
      if (!file.type.startsWith('image/')) {
        err.textContent = 'Please choose an image file for the profile photo.';
        registerAvatarInput.value = '';
        return;
      }
      try {
        registerAvatarUrl = await fileToDataUrl(file);
        registerAvatarName.textContent = file.name;
        drawAvatarPreview(registerAvatarUrl);
      } catch (e) {
        err.textContent = 'Could not load image.';
      }
    });

    setMode('login');
    drawAvatarPreview('');
  });
  </script>
</body>
</html>
