
user  nginx;
worker_processes  1;

events {
	worker_connections 1024;
}

http {
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	map $cookie_session_id $session_id {
		default $cookie_session_id;
		'' $request_id;
	}

	upstream backend_upstream {
		server api1:8000;
		server api2:8000;
	}

	upstream task_start_upstream {
		server api1:8000;
		server api2:8000;
	}

	upstream websocket_upstream {
		server api1:8000;
		server api2:8000;
	}

	server {
		listen 80;
		server_name _;

		client_max_body_size 50M;

		add_header Set-Cookie "session_id=$session_id; Path=/; Max-Age=86400" always;

		location /ws/ {
			proxy_pass http://websocket_upstream;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_connect_timeout 5s;
			proxy_send_timeout 300s;
			proxy_read_timeout 300s;
		}

		location /health {
			proxy_pass http://backend_upstream/health;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
		}

		location /static/ {
			proxy_pass http://backend_upstream/static/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
		}

		location = /api/tasks/start {
			proxy_pass http://task_start_upstream;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_connect_timeout 5s;
			proxy_send_timeout 120s;
			proxy_read_timeout 120s;
		}

		location / {
			proxy_pass http://backend_upstream;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_connect_timeout 5s;
			proxy_send_timeout 120s;
			proxy_read_timeout 120s;
		}

		location = /nginx_status {
			stub_status on;
			access_log off;
			allow 127.0.0.1;
			deny all;
		}
	}
}
